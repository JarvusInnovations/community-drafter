name: OpenTofu plan

# The credentialed half of the `tf/` gate (`specs/architecture.md`
# § Deployment; issue #8): `tofu plan -concise` against the real state, so
# an infrastructure change is read in review rather than during a release
# deploy. Read-only by construction — this workflow runs `plan` and nothing
# else, never `apply`, never `-out`, and uploads no plan file.
#
# Authentication is Workload Identity Federation, no long-lived key — but
# into a *different* service account from publish.yml's: this gate runs on
# every pull request, so it authenticates as the read-only
# `community-drafter-ci-plan` principal (viewer roles, object read on the
# state prefix) rather than as the account that deploys
# (`specs/architecture.md` § Deployment; issue #99). A pull request from a
# fork cannot mint an OIDC token, so the job is skipped there; the
# credential-free fmt/validate gate in tf-validate.yml still runs on those.
on:
  pull_request:
    paths:
      - 'tf/**'
      - '.tool-versions'
      - '.github/workflows/tf-plan.yml'
      - '.github/actions/setup-asdf/**'

permissions:
  contents: read
  id-token: write

# One plan per branch; a superseded run has nothing to finish saying.
concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same provider as publish.yml (one pool, one repo-scoped OIDC provider —
  # tf/iam.tf's google_iam_workload_identity_pool_provider.github_actions),
  # but the read-only account: tf/iam.tf's
  # google_service_account.github_actions_plan.
  WORKLOAD_IDENTITY_PROVIDER: 'projects/884668290110/locations/global/workloadIdentityPools/github/providers/community-drafter-github-actions'
  SERVICE_ACCOUNT: 'community-drafter-ci-plan@community-drafter.iam.gserviceaccount.com'
  TF_IN_AUTOMATION: 'true'

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    # Fork PRs get no id-token, so the auth step would fail red on a change
    # its author cannot do anything about.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: ./.github/actions/setup-asdf

      - name: Initialize OpenTofu
        working-directory: tf
        run: tofu init -input=false

      # `-lock=false`: a plan reads, so it has no business holding the state
      # lock a real deploy needs — and it is what lets this account hold
      # plain `roles/storage.objectViewer` on the state bucket, since taking
      # a lock would mean writing a lock object. Variables come from the committed
      # tf/terraform.tfvars, which carries the deployed image_tag a release
      # otherwise passes with -var, so the diff shown is the change under
      # review and not a tag bump nobody proposed.
      - name: Plan
        working-directory: tf
        run: tofu plan -concise -input=false -lock=false
